<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Study Hub</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6f8;color:#1f2937}.header{padding:24px 18px;background:#111827;color:white}.header h1{margin:0 0 6px}.search{padding:15px}.search input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px}.tabs{display:flex;gap:8px;overflow:auto;padding:0 15px 12px}.tabs button{border:0;border-radius:20px;padding:9px 14px;white-space:nowrap}.tabs .active{background:#111827;color:white}.list{padding:0 15px 25px}.card{background:white;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #00000010}.badge{font-size:12px;color:#6b7280}.card h3{margin:7px 0}.card p{font-size:14px;color:#6b7280}.btn{width:100%;padding:12px;border:0;border-radius:9px;background:#111827;color:white;font-weight:bold}</style></head><body><header class="header"><h1>🎓 Free Study Hub</h1><div>Free study resources in one place</div></header><div class="search"><input id="search" placeholder="🔎 Search course..." oninput="render()"></div><div class="tabs" id="tabs"></div><main class="list" id="list"></main><script>const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const courses=[{"title":"PYQ & NCERT Quiz","category":"Rajasthan Exams","desc":"NCERT, PYQ and Rajasthan GK quiz resources.","url":"https://t.me/Dhimhi"},{"title":"Taiyari Karlo Family Batch","category":"Study Courses","desc":"Study course channel.","url":"https://t.me/Taiyari_Karlo_family_batch"},{"title":"SSC English 2026","category":"SSC","desc":"SSC English 2026 study resources.","url":"https://t.me/ssc_english_2026"},{"title":"Railway NTPC Batch","category":"Railway","desc":"Railway NTPC batch study resources.","url":"https://t.me/railwayntpc_batch"},{"title":"RSSB LDC Course","category":"Rajasthan Exams","desc":"RSSB LDC course resources.","url":"https://t.me/RSSB_LDC_COURSE"},{"title":"All Test Exam","category":"Test & Practice","desc":"Test and exam practice resources.","url":"https://t.me/all_test_exam"},{"title":"Rajasthan CET — Neev Batch","category":"Rajasthan CET","desc":"Rajasthan CET Neev Batch.","url":"https://t.me/RAJASTHAN_CET_NEEV_BATCH"},{"title":"REET Level 2 — SST","category":"REET Level 2","desc":"REET Level 2 SST course.","url":"https://t.me/SST_REET_LEVEL_2"},{"title":"Kalam — REET Level 2","category":"Kalam","desc":"Kalam REET Level 2 course.","url":"https://t.me/reetl2kalam"},{"title":"Kalam — CET GK","category":"Kalam","desc":"Kalam Rajasthan CET GK course.","url":"https://t.me/Kalam_cet_gk"},{"title":"Utkarsh — Batch","category":"Utkarsh","desc":"Utkarsh batch resources.","url":"https://t.me/Utkarshall_batch"},{"title":"Shivani Mam — LDC English","category":"Shivani Mam","desc":"VIPM Academy Shivani Mam LDC English. Free course.","url":"https://t.me/VIPM_SHIVANIMAM_LDCENGLISH"},{"title":"Booster Academy — Patwar","category":"Booster Academy","desc":"Booster Academy Patwar Batch.","url":"https://t.me/BOOSTER_ACADEMY_patwar_BATCH"}];let cat="All";function openCourse(u){if(tg)tg.openTelegramLink(u);else window.open(u,"_blank")}function render(){let cats=["All",...new Set(courses.map(x=>x.category))];tabs.innerHTML=cats.map(c=>`<button class="${c==cat?'active':''}" onclick="cat='${c}';render()">${c}</button>`).join("");let q=search.value.toLowerCase();let a=courses.filter(x=>(cat=="All"||x.category==cat)&&(x.title.toLowerCase().includes(q)||x.desc.toLowerCase().includes(q)));list.innerHTML=a.length?a.map(x=>`<article class="card"><span class="badge">📚 ${x.category}</span><h3>${x.title}</h3><p>${x.desc}</p><button class="btn" onclick="openCourse('${x.url}')">📖 Open Course</button></article>`).join(""):"<p>No courses found.</p>"}render();</script></body></html>
