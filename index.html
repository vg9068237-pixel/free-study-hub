<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Study Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='11813727' data-sdk='show_11813727'></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#172033}.header{background:#111827;color:white;padding:28px 18px}.header h1{margin:0;font-size:32px}.header p{margin:8px 0 0;font-size:17px}.wrap{max-width:760px;margin:auto;padding:20px 14px}.search{width:100%;padding:17px;border:1px solid #ddd;border-radius:18px;font-size:17px}.tabs{display:flex;gap:10px;overflow:auto;padding:16px 0}.tab{border:0;background:#e9ebef;border-radius:24px;padding:12px 18px;white-space:nowrap}.active{background:#111827;color:white}.card{background:white;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 3px 14px #00000012}.cat{color:#6b7280;font-size:14px}.title{font-size:23px;font-weight:700;margin:10px 0}.desc{color:#6b7280;line-height:1.45;margin-bottom:18px}.open{width:100%;padding:15px;border:0;border-radius:15px;background:#111827;color:white;font-size:16px;font-weight:700}

.ad-box{margin:16px 0;padding:16px;border-radius:14px;border:1px solid #ddd;text-align:center}
.ad-box h3{margin:0 0 8px}
.ad-box p{margin:0 0 12px}
.ad-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ad-buttons button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer}

</style>
</head>
<body>
<div class="header"><h1>🎓 Free Study Hub</h1><p>Free study resources in one place</p></div>
<div class="wrap">
<input id="search" class="search" placeholder="🔎 Search course..." oninput="render()">
<div class="tabs" id="tabs"></div>
<div id="courses"></div>
</div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
const courses=[
["PYQ & NCERT Quiz","Rajasthan Exams","NCERT, PYQ and Rajasthan GK quiz resources.","https://t.me/Dhimhi"],
["Taiyari Karlo Family Batch","Study Courses","Study course channel.","https://t.me/Taiyari_Karlo_family_batch"],
["SSC English 2026","SSC","SSC English preparation resources.","https://t.me/ssc_english_2026"],
["Railway NTPC Batch","Railway","Railway NTPC preparation resources.","https://t.me/railwayntpc_batch"],
["RSSB LDC Course","Rajasthan Exams","RSSB LDC preparation resources.","https://t.me/RSSB_LDC_COURSE"],
["All Test Exam","Test & Practice","Test and exam practice resources.","https://t.me/all_test_exam"],
["Rajasthan CET Neev Batch","Rajasthan Exams","Rajasthan CET preparation resources.","https://t.me/RAJASTHAN_CET_NEEV_BATCH"],
["SST REET Level 2","REET","REET Level 2 SST preparation resources.","https://t.me/SST_REET_LEVEL_2"],
["REET L2 Kalam","Kalam","Kalam REET Level 2 preparation resources.","https://t.me/reetl2kalam"],
["Kalam CET GK","Kalam","Kalam CET GK preparation resources.","https://t.me/Kalam_cet_gk"],
["Utkarsh Batch","Utkarsh","Utkarsh preparation batch resources.","https://t.me/Utkarshall_batch"],
["Shivani Mam LDC English","Shivani Mam","Rising Star VIPM Academy — LDC English resources.","https://t.me/VIPM_SHIVANIMAM_LDCENGLISH"],
["Booster Academy Patwar Batch","Booster Academy","Patwar preparation batch resources.","https://t.me/BOOSTER_ACADEMY_patwar_BATCH"]
];
let active="All";
const cats=["All",...new Set(courses.map(x=>x[1]))];
async function openCourse(url){
  const adFn = window.show_11813727;
  if (typeof adFn !== 'function') {
    alert('विज्ञापन अभी उपलब्ध नहीं है। कुछ सेकंड बाद फिर कोशिश करें।');
    return;
  }

  try {
    await adFn();

    // Open the Telegram destination only after the rewarded ad resolves.
    if (window.Telegram && window.Telegram.WebApp) {
      if (typeof window.Telegram.WebApp.openTelegramLink === 'function') {
        window.Telegram.WebApp.openTelegramLink(url);
        return;
      }
      if (typeof window.Telegram.WebApp.openLink === 'function') {
        window.Telegram.WebApp.openLink(url);
        return;
      }
    }

    // Browser fallback outside Telegram.
    const w = window.open(url, '_blank', 'noopener,noreferrer');
    if (!w) window.location.href = url;
  } catch (e) {
    alert('विज्ञापन पूरा नहीं हुआ, इसलिए Course नहीं खोला गया।');
  }
}
function render(){
document.getElementById("tabs").innerHTML=cats.map(c=>'<button class="tab '+(c===active?'active':'')+'" onclick="active='+JSON.stringify(c)+';render()">'+c+'</button>').join("");
const q=document.getElementById("search").value.toLowerCase();
const list=courses.filter(x=>(active==="All"||x[1]===active)&&x.join(" ").toLowerCase().includes(q));
document.getElementById("courses").innerHTML=list.length?list.map(x=>'<div class="card"><div class="cat">📚 '+x[1]+'</div><div class="title">'+x[0]+'</div><div class="desc">'+x[2]+'</div><button class="open" onclick="openCourse('+JSON.stringify(x[3])+')">📖 Open Course</button></div>').join(""):'<div style="text-align:center;padding:30px;color:#777">No course found.</div>';
}
render();
</script>

</body></html>
